<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfilSense ToS</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;">
    <link rel="icon" type="image/x-icon" href="Media/InfilSenseTransparentLogo.png">
	<link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
        font-family: 'Arial', sans-serif;
        overflow-x: hidden;
    }

    .section-title {
        text-align: center;
        font-size: 3.5rem;
        padding-top: 2rem;
        margin-bottom: 2rem;
    }

    .terms-section {
        padding: 60px 5% 5rem;
        min-height: 100vh;
        color: #ffffff;
        position: relative;
        z-index: 1;
    }

    .terms-grid {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        margin-top: 4rem;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
    }

    .terms-card {
        background: rgba(3, 8, 20, 0.8);
        border: 1px solid #101420;
        border-radius: 15px;
        padding: 2rem;
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        color: #ffffff;
        margin-bottom: 2rem;
        width: 100%;
        box-sizing: border-box;

        text-align: left;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .terms-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 0 30px rgba(90, 158, 248, 0.3);
    }

    .card-icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        color: #5A9EF8;
        text-align: center;
    }

    .terms-card h2,
    .terms-card h3 {
        color: #ffffff;
        text-align: center;
        margin-bottom: 1rem;
    }

    .terms-card p {
        color: #ffffff;
        margin-bottom: 1rem;
        line-height: 1.6;
    }

    .terms-card ul {
        padding-left: 0;
        margin: 1rem 0;
        list-style: none;
    }

    .terms-card li {
        margin-bottom: 10px;
        padding-left: 1.5rem;
        position: relative;
        color: #ffffff;
    }

    .terms-card li::before {
        content: "•";
        color: #5A9EF8;
        position: absolute;
        left: 0;
        top: 0;
    }

    .terms-card a {
        color: #5A9EF8;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .terms-card a:hover {
        color: #3676EF;
    }

    @media (max-width: 768px) {
        .section-title {
            font-size: 2.5rem;
        }

        .terms-card {
            padding: 1.5rem;
        }
    }
</style>
<body>
    <div id="header"></div>
    <div class="retrowave-bg"></div>
    <div class="retro-tiles animate__animated animate__fadeInUp">
        <div class="tile-grid"></div>
    </div>
    <div id="particles-js"></div>

    <main class="terms-section">
        <h1 class="section-title gradient-text animate__animated animate__fadeInDown">
            Contact Us
        </h1>

        <div class="terms-grid animate__animated animate__fadeIn animate__delay-1s">
            <div class="terms-card">
                <div class="card-icon">
                    <img src="Media/ContactUs.png" alt="Contact Us Icon" width="60" height="60">
                </div>
                <h3 class="infilsense-gradient">Methods</h3>
                <h3>Emails</h3>
                <p>contact@infilsense.dpdns.org</p>
                <p>OR admin+bkkpro1980@infilsense.dpdns.org</p>

                <h3>Discord</h3>
                <p>Our <a href="community.html">Discord server</a>.</p>
                <p>OR @bkkpro1980 on Discord.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>By using our service(s), you acknowledge that you have read, understood, and agree to be bound by our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
