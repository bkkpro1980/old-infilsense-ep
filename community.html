<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfilSense Community</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;">
    <link rel="icon" type="image/x-icon" href="Media/InfilSenseTransparentLogo.png">
	<link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<style>
    .community-section {
        padding: 120px 5% 50px;
        min-height: 100vh;
    }

    .section-title {
        text-align: center;
        font-size: 3.5rem;
        margin-bottom: 4rem;
    }

    .community-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        margin: 3rem 0;
    }

    .community-card {
        background: rgba(3, 8, 20, 0.8);
        border: 1px solid #101420;
        border-radius: 15px;
        padding: 2rem;
        text-align: center;
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .community-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 0 30px rgba(90, 158, 248, 0.3);
    }

    .card-icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        color: #5A9EF8;
    }

    .community-card h3 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
    }

    .community-card p {
        color: #989BA3;
        margin-bottom: 1.5rem;
    }

    .community-btn {
        background: linear-gradient(45deg, #5A9EF8, #3676EF);
        border: none;
        border-radius: 10px;
        padding: 0.8rem 1.5rem;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .community-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(90, 158, 248, 0.5);
    }
</style>
<body>
    <div id="header"></div>
    <div class="retrowave-bg"></div>
    <div class="retro-tiles animate__animated animate__fadeInUp">
        <div class="tile-grid"></div>
    </div>
    <div id="particles-js"></div>

    <main class="community-section">
        <h1 class="section-title gradient-text animate__animated animate__fadeInDown">
            Join Our Community
        </h1>

        <div class="community-grid animate__animated animate__fadeIn animate__delay-1s">
            <div class="community-card">
                <div class="card-icon">
                    <img src="Media/DiscordIcon.png" alt="Discord Icon" width="60" height="60" loading="lazy" decoding="async">
                </div>
                <h3 class="infilsense-gradient">Discord Community</h3>
                <p>Join our Discord community</p>
                <a href="https://discord.gg/VDQgaCxUtD" target="_blank" class="community-btn">Join Discord</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>By using our service(s), you acknowledge that you have read, understood, and agree to be bound by our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </footer>

    <script defer src="js/main.js"></script>
</body>
</html>
