<!DOCTYPE html>
<html lang="en">
<head>
    <title>InfilSense Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.gstatic.com 'unsafe-inline' https://*.asia-southeast1.firebasedatabase.app;">
    <link rel="icon" type="image/x-icon" href="Media/InfilSenseTransparentLogo.png">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="header"></div>
    <div class="retrowave-bg"></div>
    <div class="retro-tiles animate__animated animate__fadeInUp">
        <div class="tile-grid"></div>
    </div>
    <div id="particles-js"></div>
    
    <div class="admin-dashboard-container">
        <div style="margin-top: 4rem;"></div>
        <h2 class="animate__animated animate__fadeInLeft">Admin Database Management</h2>
        <p class="animate__animated animate__slideInLeft" style="padding-bottom: 2rem;">Manage license keys and user connections below.</p>
        
        <div class="animate__animated animate__fadeIn animate__delay-1s">
            <div class="table-section">
                <h3>Configurations</h3>
                <input type="text" id="configs-search" class="table-search" placeholder="Search configs..." />
                <div class="table-container">
                    <table id="configs-table">
                        <thead>
                            <tr>
                                <th>Config ID</th>
                                <th>Config Data</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="table-section">
                <h3>Unused License Keys</h3>
                <input type="text" id="keys-search" class="table-search" placeholder="Search unused license keys..." />
                <div class="table-container">
                    <table id="keys-table">
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Key Data</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="animate__animated animate__fadeInLeft animate__delay-2s" style="padding-top: 2rem;">
            <h3>Logout of the dashboard</h3>
            <button id="logout-button" title="Logout">
                <i class="fas fa-arrow-right"></i> 
            </button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modal-title">Edit Entry</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-path">
                <textarea id="edit-data" rows="10" placeholder="Edit the JSON data for this entry..."></textarea>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1MUsCV6cnfTIsdAedHN_YHxRSs4roq9g",
            authDomain: "infilsense.firebaseapp.com",
            databaseURL: "https://infilsense-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "infilsense",
            storageBucket: "infilsense.firebasestorage.app",
            messagingSenderId: "519762948454",
            appId: "1:519762948454:web:e705cfa4881b1f003d18a7",
            measurementId: "G-5R1TE7L43Y"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="admin.js"></script>
    <script src="main.js"></script>
</body>
</html>
